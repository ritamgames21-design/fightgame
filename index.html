
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto: Shadow Run — PRO</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,#24365e 0%,#10172b 42%,#05070d 100%);
  font-family:Arial,Helvetica,sans-serif;
}
.shell{
  width:min(96vw,1200px);
  position:relative;
}
canvas{
  width:100%;
  height:auto;
  display:block;
  aspect-ratio:16/9;
  border:2px solid rgba(220,238,255,.5);
  border-radius:16px;
  background:#090d18;
  box-shadow:
    0 25px 80px rgba(0,0,0,.75),
    0 0 55px rgba(80,160,255,.14);
}
.controls{
  position:absolute;
  left:18px;
  bottom:12px;
  color:rgba(235,243,255,.75);
  font-size:12px;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}
.touch-controls{
  display:none;
}
.mobile-pause{
  display:none;
  position:absolute;
  top:18px;
  left:50%;
  z-index:7;
  width:48px;
  height:48px;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.72);
  border-radius:50%;
  color:#fff;
  background:rgba(8,17,28,.64);
  box-shadow:0 4px 16px rgba(0,0,0,.38),inset 0 0 12px rgba(255,255,255,.12);
  font-size:18px;
  cursor:pointer;
  touch-action:manipulation;
}
.play-again{
  display:none;
  position:fixed;
  left:50%;
  top:58%;
  z-index:10;
  transform:translate(-50%,-50%);
  padding:13px 28px;
  border:1px solid rgba(255,190,90,.8);
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,#d7474d,#9e245e);
  box-shadow:0 0 28px rgba(255,70,80,.45);
  font:bold 15px Arial,sans-serif;
  letter-spacing:1px;
  cursor:pointer;
}
.play-again.visible{
  display:block;
  animation:playAgainIn .35s ease-out both;
}
.start-menu{
  position:absolute;
  inset:0;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:rgba(4,8,18,.72);
}
.start-menu.hidden{display:none}
.start-card{
  width:min(88%,520px);
  padding:30px 34px;
  border:1px solid rgba(143,232,255,.35);
  border-radius:20px;
  text-align:center;
  color:#fff;
  background:linear-gradient(145deg,rgba(13,29,58,.96),rgba(28,9,35,.94));
  box-shadow:0 18px 55px rgba(0,0,0,.52),0 0 35px rgba(74,181,255,.16);
}
.start-card h1{margin:0 0 8px;font:900 31px Arial,sans-serif;letter-spacing:1px}
.start-card h1{color:#e8fbff;text-shadow:0 0 10px #45cfff,0 0 28px rgba(255,91,180,.8)}
.start-card p{margin:0 0 22px;color:#b9cce5;font:14px Arial,sans-serif}
.difficulty-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.difficulty-button{
  min-height:68px;
  border:1px solid rgba(116,176,255,.28);
  border-radius:18px;
  color:#f3f9ff;
  background:linear-gradient(180deg,rgba(19,34,58,.96),rgba(7,15,33,.88));
  cursor:pointer;
  font:bold 15px Arial,sans-serif;
  letter-spacing:.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 18px rgba(0,0,0,.22);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.difficulty-button:hover,.difficulty-button:focus-visible{
  transform:translateY(-3px);
  border-color:#8fe8ff;
  background:linear-gradient(180deg,#1d4470,#142b4a);
  box-shadow:0 12px 22px rgba(79,176,255,.18),inset 0 1px 0 rgba(255,255,255,.14);
  outline:0;
}
.difficulty-button.active{
  border-color:#8fe8ff;
  background:linear-gradient(180deg,#1b7fcf,#0d3d73);
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 24px rgba(90,195,255,.3),0 14px 26px rgba(0,0,0,.28);
}
.difficulty-button small{display:block;margin-top:6px;color:#9db0ca;font-size:10px;font-weight:normal}
@keyframes playAgainIn{
  from{opacity:0;transform:translate(-50%,-35%) scale(.8)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@media (pointer:coarse), (max-width:700px){
  body{
    align-items:center;
    justify-content:center;
    padding:0;
    background:#061019;
  }
  .shell{
    width:min(100vw,calc(100dvh * 16 / 9));
    max-width:none;
    height:min(100dvh,calc(100vw * 9 / 16));
    max-width:100vw;
    max-height:100vh;
    aspect-ratio:16 / 9;
    overflow:hidden;
  }
  canvas{
    width:100%;
    height:100%;
    border:0;
    border-radius:0;
  }
  .mobile-pause{
    display:block;
  }
  .controls{
    display:none;
  }
  .touch-controls{
    position:absolute;
    inset:0;
    display:block;
    pointer-events:none;
    z-index:5;
  }
  .touch-group{pointer-events:auto}
  .joystick{
    display:none;
  }
  .dpad{
    position:absolute;
    left:5%;
    bottom:10%;
    width:132px;
    height:132px;
    pointer-events:auto;
  }
  .dpad-button{
    position:absolute;
    width:48px;
    height:48px;
    border:2px solid rgba(255,255,255,.62);
    border-radius:18px;
    color:#e9faff;
    background:linear-gradient(180deg,rgba(26,38,52,.9),rgba(13,17,25,.88));
    box-shadow:0 4px 12px rgba(0,0,0,.48),inset 0 0 10px rgba(126,215,255,.12);
    font:bold 22px Arial,sans-serif;
    pointer-events:auto;
    touch-action:none;
  }
  .dpad-up{left:42px;top:0}
  .dpad-down{left:42px;bottom:0}
  .dpad-left{left:0;top:42px}
  .dpad-right{right:0;top:42px}
  .dpad-center{
    position:absolute;
    left:42px;
    top:42px;
    width:48px;
    height:48px;
    border-radius:7px;
    background:rgba(5,12,22,.72);
  }
  .shoulder-controls{
    position:absolute;
    top:50%;
    right:4%;
    display:grid;
    grid-template-columns:repeat(2,auto);
    gap:8px;
    transform:translateY(-50%);
    pointer-events:auto;
  }
  .shoulder-group{display:contents}
  .power-control{
    display:block;
  }
  .shoulder-button,.system-button{
    min-width:82px;
    height:42px;
    padding:0 10px;
    border:2px solid rgba(255,255,255,.5);
    border-radius:18px;
    color:#eafaff;
    background:linear-gradient(180deg,rgba(21,37,52,.92),rgba(8,15,23,.9));
    box-shadow:0 4px 12px rgba(0,0,0,.42),inset 0 0 10px rgba(255,255,255,.06);
    font:bold 9px Arial,sans-serif;
    touch-action:none;
  }
  .system-controls{
    position:absolute;
    top:25%;
    left:50%;
    display:flex;
    gap:12px;
    transform:translateX(-50%);
    pointer-events:auto;
  }
  .system-button{min-width:54px;height:27px;font-size:9px}
  .face-controls{
    position:absolute;
    right:5%;
    bottom:9%;
    width:138px;
    height:138px;
    pointer-events:auto;
  }
  .face-button{
    position:absolute;
    width:54px;
    height:54px;
    border:2px solid rgba(255,255,255,.72);
    border-radius:18px;
    color:#fff;
    background:linear-gradient(180deg,rgba(17,30,42,.9),rgba(8,16,23,.88));
    box-shadow:0 5px 16px rgba(0,0,0,.48);
    font:bold 18px Arial,sans-serif;
    touch-action:none;
  }
  .face-x{left:42px;top:0;border-color:#8fe8ff}
  .face-y{left:0;top:42px;border-color:#ffcf70}
  .face-a{right:0;top:42px;border-color:#ff7d93}
  .face-b{left:42px;bottom:0;border-color:#b890ff}
  .face-label{position:absolute;inset:auto 0 -22px;color:rgba(255,255,255,.64);font:9px Arial;text-align:center}
  .touch-button{user-select:none}
  .touch-button:active,.dpad-button:active,.face-button:active,.shoulder-button:active,.system-button:active{
    background:#b63855;
    transform:translateY(2px);
  }
  .kick-button{border-color:rgba(255,176,74,.9);background:rgba(61,29,20,.8)}
  .thunder-button{border-color:rgba(121,221,255,.9);background:rgba(16,47,70,.8);font-size:10px}
  .beam-button{border-color:rgba(255,242,176,.95);background:rgba(77,43,18,.86);font-size:11px}
  .touch-button.cooldown{
    opacity:.5;
    filter:saturate(.45);
  }
  .power-button{
    font-size:13px;
    border-radius:50%;
    width:64px;
    height:64px;
    padding:0;
  }
  @media (max-width:430px){
    .dpad{left:3%;bottom:8%;transform:scale(.82);transform-origin:left bottom}
    .face-controls{right:3%;bottom:7%;transform:scale(.82);transform-origin:right bottom}
    .shoulder-controls{top:50%;right:3%;left:auto;bottom:auto;transform:scale(.82) translateY(-50%);transform-origin:right center}
  }
}
@media (orientation:portrait) and (max-width:900px){
  .shell{
    filter:blur(2px);
  }
  .touch-controls,
  .mobile-pause{
    opacity:0;
    pointer-events:none;
  }
  body::before{
    content:"ROTATE PHONE FOR LANDSCAPE PLAY";
    position:fixed;
    left:50%;
    top:50%;
    z-index:20;
    transform:translate(-50%,-50%);
    padding:14px 18px;
    border:1px solid rgba(255,180,84,.65);
    border-radius:14px;
    color:#ffd27a;
    background:rgba(5,10,22,.92);
    box-shadow:0 0 30px rgba(255,84,46,.28);
    font:bold 13px Arial,sans-serif;
    letter-spacing:1px;
    text-align:center;
    pointer-events:none;
  }
}
</style>
</head>
<body>
<div class="shell">
<canvas id="game" width="1200" height="675"></canvas>
<button class="mobile-pause" id="mobile-pause" type="button" aria-label="Pause game">Ⅱ</button>
<div class="controls">A / D or ← / → move · Space / W / ↑ jump · Shift Blink · J Rasengan (5 DMG) · H Beam · F Fire Style · L Tornado Kick · T Thunderstorm · K Nine-Tails · R restart</div>
<div class="start-menu" id="start-menu">
  <div class="start-card">
    <h1>NARUTO: SHADOW RUN</h1>
    <p>Choose your challenge before facing Pain.</p>
    <div class="difficulty-list">
      <button class="difficulty-button" data-difficulty="easy">EASY<small>Same HP · slower Pain</small></button>
      <button class="difficulty-button active" data-difficulty="normal">NORMAL<small>Same HP · strong Pain</small></button>
      <button class="difficulty-button" data-difficulty="hard">HARD<small>Same HP · insane Pain</small></button>
    </div>
  </div>
</div>
</div>
<div class="touch-controls" aria-label="Mobile game controls">
  <div class="dpad" aria-label="Move controls">
    <div class="joystick" id="joystick"><div class="joystick-knob" id="joystick-knob"></div></div>
    <button class="dpad-button dpad-up touch-button" data-key="arrowup" aria-label="Move up">&#9650;</button>
    <button class="dpad-button dpad-left touch-button" data-key="arrowleft" aria-label="Move left">&#9664;</button>
    <span class="dpad-center"></span>
    <button class="dpad-button dpad-right touch-button" data-key="arrowright" aria-label="Move right">&#9654;</button>
    <button class="dpad-button dpad-down touch-button" data-key="arrowdown" aria-label="Move down">&#9660;</button>
  </div>
  <div class="shoulder-controls" aria-label="Power controls">
    <div class="shoulder-group">
      <div class="power-control"><button class="shoulder-button touch-button" data-action="rasengan" aria-label="Rasengan">RASENGAN</button></div>
      <div class="power-control"><button class="shoulder-button touch-button" data-action="blink" aria-label="Blink">BLINK</button></div>
      <div class="power-control"><button class="shoulder-button touch-button" data-action="fire" aria-label="Fire Style">FIRE STYLE</button></div>
    </div>
    <div class="shoulder-group">
      <div class="power-control"><button class="shoulder-button touch-button" data-action="kick" aria-label="Tornado Kick">TORNADO KICK</button></div>
      <div class="power-control"><button class="shoulder-button touch-button" data-action="thunder" aria-label="Thunderstorm">THUNDERSTORM</button></div>
      <div class="power-control"><button class="shoulder-button touch-button" data-action="nine" aria-label="Nine-Tails">NINE-TAILS</button></div>
    </div>
    <div class="shoulder-group">
      <div class="power-control"><button class="shoulder-button touch-button" data-action="beam" aria-label="Beam">BEAM</button></div>
    </div>
  </div>
</div>
<button class="play-again" id="play-again" type="button">PLAY AGAIN</button>

<script>
"use strict";

/* =========================================================
   NARUTO: SHADOW RUN — PRO
   Important physics fix:
   - Collision is calculated using previous Y position.
   - Player can only land while falling.
   - Falling past the world triggers a safe respawn.
   - Character spawn positions are calculated from platform tops.
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const playAgainButton = document.getElementById("play-again");
const startMenu = document.getElementById("start-menu");
const mobilePauseButton = document.getElementById("mobile-pause");

const GAME = {
  width: canvas.width,
  height: canvas.height,
  gravity: 0.68,
  maxFallSpeed: 15
};

const PERFORMANCE={
  low:
    window.matchMedia("(pointer: coarse)").matches ||
    (navigator.hardwareConcurrency || 8)<=4,
  maxParticles:window.matchMedia("(pointer: coarse)").matches ? 150 : 240,
  starCount:window.matchMedia("(pointer: coarse)").matches ? 80 : 120
};

const DIFFICULTIES = {
  easy: {label:"EASY", fighterHp:140, bossSpeed:1.7, attackDelay:120, projectileDamage:14, projectileSpeed:4.6, powerScale:1.1, enemyPowerScale:1.15, enemyBeamCooldown:220, painThunderDelay:440},
  normal: {label:"NORMAL", fighterHp:120, bossSpeed:2.4, attackDelay:66, projectileDamage:28, projectileSpeed:6.4, powerScale:1.4, enemyPowerScale:1.8, enemyBeamCooldown:135, painThunderDelay:260},
  hard: {label:"HARD", fighterHp:120, bossSpeed:2.8, attackDelay:50, projectileDamage:40, projectileSpeed:7.3, powerScale:1.6, enemyPowerScale:2.1, enemyBeamCooldown:90, painThunderDelay:150}
};
let difficultyKey="normal";
let difficulty=DIFFICULTIES.normal;

ctx.imageSmoothingEnabled = true;

const images = {
  naruto: new Image(),
  pain: new Image()
};

function loadCharacterImage(image,path,name){
  image.onload=()=>draw();
  image.onerror=()=>console.error(`Could not load ${name}: ${path}`);
  image.src=new URL(path,document.baseURI).href;
}

loadCharacterImage(images.naruto,"assets/naruto.jpg","Naruto");
loadCharacterImage(images.pain,"assets/pain.jpg","Pain");
const keys = Object.create(null);
const particles = [];
const projectiles = [];
const enemyProjectiles = [];
const fireballs = [];
const tornadoKicks = [];
const thunderStrikes = [];
const beamAttacks = [];
const sounds = {
  background: new Audio("sounds/mixkit-sports-highlights-51.mp3"),
  nineTails: new Audio("sounds/mixkit-body-cutting-impact-2199.wav"),
  painAttack: new Audio("sounds/mixkit-body-cutting-impact-2199.wav")
};

sounds.background.loop=true;
sounds.background.volume=.12;
sounds.background.preload="auto";
sounds.nineTails.preload="auto";
sounds.painAttack.preload="auto";
sounds.background.load();
sounds.nineTails.load();
sounds.painAttack.load();

function playSound(sound){
  if(!sound || !sound.src){
    return;
  }

  sound.currentTime=0;
  sound.volume=.7;
  sound.play().catch(()=>{});
}

function playPainAttackSound(){
  if(painSoundCooldown>0){
    return;
  }

  painSoundCooldown=24;
  playSound(sounds.painAttack);
}
let musicContext=null;
let musicTimer=null;
let backgroundFadeTimer=null;

let score = 0;
let state = "menu";
let frame = 0;
let shake = 0;
let countdownFrames = 0;
let painSoundCooldown = 0;
let lastAbilityUiFrame=-30;
let displayedPlayerHp=120;
let displayedBossHp=100;

function requestLandscapeMode(){
  if(!window.matchMedia("(pointer: coarse)").matches){
    return;
  }

  const lockLandscape=()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock("landscape").catch(()=>{});
    }
  };

  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().then(lockLandscape).catch(()=>{});
    return;
  }

  lockLandscape();
}

document.addEventListener("pointerdown",requestLandscapeMode,{once:true});

function togglePause(){
  if(state==="playing"){
    state="paused";
    mobilePauseButton.textContent="▶";
    mobilePauseButton.setAttribute("aria-label","Resume game");
  }else if(state==="paused"){
    state="playing";
    mobilePauseButton.textContent="Ⅱ";
    mobilePauseButton.setAttribute("aria-label","Pause game");
  }
}

mobilePauseButton.addEventListener("pointerdown",event=>{
  event.preventDefault();
  togglePause();
});

/* -------------------------
   World
------------------------- */

const platforms = [
  {x:0, y:590, width:1200, height:85, type:"ground"}
];

const orbs = [];

const stars = Array.from({length:PERFORMANCE.starCount},()=>({
  x:Math.random()*GAME.width,
  y:Math.random()*GAME.height*.58,
  r:Math.random()*1.5+.25,
  phase:Math.random()*Math.PI*2,
  speed:Math.random()*.035+.008
}));

/* -------------------------
   Characters
------------------------- */

const player = {
  width:78,
  height:108,

  x:90,
  y:0,
  previousY:0,

  vx:0,
  vy:0,

  acceleration:.72,
  maxSpeed:6,
  friction:.80,

  jumpPower:-14.5,
  grounded:false,
  flying:false,
  jumpHeld:false,

  direction:1,
  animationTime:0,
  landSquash:0,

  hp:120,
  maxHp:120,

  attackCooldown:0,
  fireCooldown:0,
  invulnerable:0,
  nineTailsTimer:0,
  nineTailsCooldown:0,
  attackPose:0,
  kickCooldown:0,
  kickPose:0,
  thunderCooldown:0,
  beamCooldown:0,
  blinkCooldown:0,
  blinkFlash:0,

  spawnX:90
};

const boss = {
  width:84,
  height:112,

  x:900,
  y:0,

  vx:1.45,
  minX:720,
  maxX:1090,

  hp:100,
  maxHp:100,

  hitFlash:0,
  attackCooldown:0,
  thunderCooldown:480,
  beamCooldown:180,
  blinkCooldown:0,
  blinkFlash:0,
  speed:1.8,
  vy:0,
  previousY:0,
  animationTime:0,
  landSquash:0,
  grounded:true,
  flying:false,
  flightTimer:0,
  flightTargetY:0,
  flightTargetX:0,
  aiTimer:80,
  jumpCooldown:90
};

/* -------------------------
   Utility
------------------------- */

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function rectsOverlap(a,b){
  return (
    a.x < b.x+b.width &&
    a.x+a.width > b.x &&
    a.y < b.y+b.height &&
    a.y+a.height > b.y
  );
}

function getGroundY(body){
  return platforms[0].y-body.height;
}

function respawnPlayer(){
  player.x=player.spawnX;
  player.y=getGroundY(player);
  player.previousY=player.y;
  player.vx=0;
  player.vy=0;
  player.grounded=true;
}

function createParticle(x,y,type){
  if(particles.length>=PERFORMANCE.maxParticles){
    return;
  }

  const angle=Math.random()*Math.PI*2;
  const speed=Math.random()*4+1;

  particles.push({
    x,
    y,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    size:Math.random()*4+2,
    life:1,
    type
  });
}

function burst(x,y,count,type){
  for(let i=0;i<count;i++){
    createParticle(x,y,type);
  }
}

function startBackgroundMusic(){
  if(backgroundFadeTimer){
    return;
  }

  sounds.background.volume=0;
  sounds.background.play().catch(()=>{});

  let volume=0;
  backgroundFadeTimer=setInterval(()=>{
    volume=Math.min(.12,volume+.01);
    sounds.background.volume=volume;

    if(volume>=.12){
      clearInterval(backgroundFadeTimer);
      backgroundFadeTimer=null;
    }
  },120);
}

/* -------------------------
   Input
------------------------- */

window.addEventListener("keydown",event=>{
  startBackgroundMusic();
  const key=event.key.toLowerCase();
  keys[key]=true;

  if([
    "arrowleft",
    "arrowright",
    "arrowup",
    " ",
    "w",
    "a",
    "d",
    "j",
    "k",
    "f",
    "l",
    "t",
    "h",
    "shift"
  ].includes(key)){
    event.preventDefault();
  }

  if(
    (key===" " || key==="w" || key==="arrowup") &&
    player.grounded &&
    state==="playing"
  ){
    player.vy=player.jumpPower;
    player.grounded=false;

    burst(
      player.x+player.width/2,
      player.y+player.height,
      12,
      "jump"
    );
  }

  if(key==="j" && !event.repeat){
    fireRasengan();
  }

  if(key==="f" && !event.repeat){
    fireFireball();
  }

  if(key==="l" && !event.repeat){
    fireTornadoKick();
  }

  if(key==="t" && !event.repeat){
    fireThunderstorm("player");
  }

  if(key==="h" && !event.repeat){
    fireKamehameha("player");
  }

  if(key==="shift" && !event.repeat){
    triggerPlayerBlink();
  }

  if(
    key==="k" &&
    !event.repeat &&
    state==="playing" &&
    player.nineTailsTimer===0 &&
    player.nineTailsCooldown===0
  ){
    player.nineTailsTimer=120;
    shake=14;
    fireNineTailsBlast();
    burst(
      player.x+player.width/2,
      player.y+player.height/2,
      45,
      "nineTails"
    );
  }

  if(key==="r" && state!=="playing"){
    showStartMenu();
  }
});

document.querySelectorAll(".touch-button").forEach(button=>{

    }

      player.nineTailsTimer===0 &&
      player.nineTailsCooldown===0

      shake=14;

  button.addEventListener("pointerup",event=>{

  });
});

const joystick=document.getElementById("joystick");
const joystickKnob=document.getElementById("joystick-knob");
let joystickPointerId=null;

function resetJoystick(){
  keys.arrowleft=false;
  keys.arrowright=false;
  keys.arrowup=false;
  keys.arrowdown=false;
  joystickKnob.style.transform="translate(0,0)";
}

function moveJoystick(event){
  if(event.pointerId!==joystickPointerId){
    return;
  }

  const rect=joystick.getBoundingClientRect();
  const centerX=rect.left+rect.width/2;
  const centerY=rect.top+rect.height/2;
  const offsetX=event.clientX-centerX;
  const offsetY=event.clientY-centerY;
  const distance=Math.hypot(offsetX,offsetY) || 1;
  const maxDistance=34;
  const scale=Math.min(1,maxDistance/distance);
  const knobX=offsetX*scale;
  const knobY=offsetY*scale;

  joystickKnob.style.transform=`translate(${knobX}px,${knobY}px)`;
  keys.arrowleft=knobX<-10;
  keys.arrowright=knobX>10;
  keys.arrowup=knobY<-10;
  keys.arrowdown=knobY>10;
}

joystick.addEventListener("pointerdown",event=>{
  event.preventDefault();
  requestLandscapeMode();
  startBackgroundMusic();
  joystickPointerId=event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveJoystick(event);
});

joystick.addEventListener("pointermove",moveJoystick);
joystick.addEventListener("pointerup",event=>{
  if(event.pointerId===joystickPointerId){
    joystickPointerId=null;
    resetJoystick();
  }
});
joystick.addEventListener("pointercancel",()=>{
  joystickPointerId=null;
  resetJoystick();
});

   Player
------------------------- */

function triggerPlayerBlink(){
  if(state!=="playing" || player.blinkCooldown>0){
    return;
  }

  const dashDistance=180;
  const targetX=clamp(
    player.x + player.direction * dashDistance,
    0,
    GAME.width-player.width
  );

  player.x=targetX;
  player.vx=player.direction*18;
  player.blinkCooldown=200;
  player.blinkFlash=12;
  player.invulnerable=Math.max(player.invulnerable,18);
  burst(player.x+player.width/2,player.y+player.height*.5,30,"chakra");
  shake=12;
}

function triggerBossBlink(){
  if(state!=="playing" || boss.hp<=0 || boss.blinkCooldown>0){
    return;
  }

  const dir=Math.sign(player.x-boss.x) || 1;
  const blinkDistance=160;
  const targetX=clamp(
    boss.x + dir * blinkDistance,
    90,
    GAME.width-boss.width-90
  );

  boss.x=targetX;
  boss.vx=dir*7;
  boss.blinkCooldown=240;
  boss.blinkFlash=14;
  burst(boss.x+boss.width/2,boss.y+boss.height*.46,28,"painAttack");
  shake=14;
}

function updatePlayer(){
  player.previousY=player.y;
  const wasGrounded=player.grounded;

  if(player.grounded && keys.arrowup && !player.jumpHeld){
    player.vy=player.jumpPower;
    player.grounded=false;
  }
  player.jumpHeld=!!keys.arrowup;

  const moveDirection=(keys.d || keys.arrowright ? 1 : 0)-
    (keys.a || keys.arrowleft ? 1 : 0);
  const topSpeed=player.nineTailsTimer>0 ? 9 : player.maxSpeed;
  const targetVelocity=moveDirection*topSpeed;

  if(moveDirection!==0){
    player.direction=moveDirection;
    player.vx+=(targetVelocity-player.vx)*.16;
  }else{
    player.vx*=.86;
    if(Math.abs(player.vx)<.04){
      player.vx=0;
    }
  }

  player.vx=clamp(player.vx,-topSpeed,topSpeed);

  player.x+=player.vx;

  /* Vertical physics: hold joystick up/down to steer in the air. */
  const flightDirection=(keys.arrowdown ? 1 : 0)-(keys.arrowup ? 1 : 0);
  player.flying=!player.grounded && flightDirection!==0;

  if(player.flying){
    player.vy+=(flightDirection*5-player.vy)*.22;
  }else{
    player.vy+=GAME.gravity;
    player.vy=clamp(player.vy,-30,GAME.maxFallSpeed);
  }

  player.y+=player.vy;

  player.grounded=false;

  /*
    Robust one-way platform collision.

    previousBottom = where the feet were last frame.
    currentBottom  = where the feet are now.

    We only land if the player crossed the platform top
    while moving downward.
  */
  const previousBottom=
    player.previousY+player.height;

  const currentBottom=
    player.y+player.height;

  if(player.vy>=0){
    for(const platform of platforms){
      const horizontalOverlap=
        player.x+player.width>platform.x &&
        player.x<platform.x+platform.width;

      const crossedTop=
        previousBottom<=platform.y &&
        currentBottom>=platform.y;

      if(horizontalOverlap && crossedTop){
        player.y=platform.y-player.height;
        player.vy=0;
        player.grounded=true;
        player.flying=false;
        player.jumpHeld=false;
        if(!wasGrounded){
          player.landSquash=1;
        }
        break;
      }
    }
  }

  player.animationTime+=Math.abs(player.vx)>.15
    ? .16+Math.abs(player.vx)*.045
    : .025;
  player.landSquash=Math.max(0,player.landSquash-.12);

  /* Keep player inside the horizontal world. */
  player.x=clamp(
    player.x,
    0,
    GAME.width-player.width
  );

  if(player.y<54){
    player.y=54;
    player.vy=Math.max(0,player.vy);
  }

  /* Safety net: never let the character disappear below map. */
  if(player.y>GAME.height+160){
    damagePlayer();
    if(state==="playing"){
      respawnPlayer();
    }
  }

  if(player.blinkCooldown>0){
    player.blinkCooldown--;
  }

  if(player.blinkFlash>0){
    player.blinkFlash--;
  }

  if(player.attackCooldown>0){
    player.attackCooldown--;
  }

  if(player.kickCooldown>0){
    player.kickCooldown--;
  }

  if(player.thunderCooldown>0){
    player.thunderCooldown--;
  }

  if(player.beamCooldown>0){
    player.beamCooldown--;
  }

  if(player.kickPose>0){
    player.kickPose--;
  }

  if(player.fireCooldown>0){
    player.fireCooldown--;
  }

  if(player.invulnerable>0){
    player.invulnerable--;
  }

  if(player.nineTailsTimer>0){
    player.nineTailsTimer--;

    if(player.nineTailsTimer===0){
      player.nineTailsCooldown=360;
    }
  }else if(player.nineTailsCooldown>0){
    player.nineTailsCooldown--;
  }

  if(player.attackPose>0){
    player.attackPose--;
  }
}

function updateAbilityButtons(){
  if(frame-lastAbilityUiFrame<6){
    return;
  }
  lastAbilityUiFrame=frame;

  const fireButtons=document.querySelectorAll('[data-action="fire"]');
  const kickButtons=document.querySelectorAll('[data-action="kick"]');
  const blinkButtons=document.querySelectorAll('[data-action="blink"]');
  const nineButtons=document.querySelectorAll('[data-action="nine"]');

  if(fireButtons.length){
    const fireReady=player.fireCooldown===0;
    fireButtons.forEach(button=>button.classList.toggle("cooldown",!fireReady));
  }

  if(blinkButtons.length){
    const blinkReady=player.blinkCooldown===0;
    blinkButtons.forEach(button=>button.classList.toggle("cooldown",!blinkReady));
  }

  if(kickButtons.length){
    const kickReady=player.kickCooldown===0;
    kickButtons.forEach(button=>button.classList.toggle("cooldown",!kickReady));
  }

  const thunderButton=document.querySelector('[data-action="thunder"]');
  if(thunderButton){
    const thunderReady=player.thunderCooldown===0;
    document.querySelectorAll('[data-action="thunder"]').forEach(button=>button.classList.toggle("cooldown",!thunderReady));
  }

  const beamButtons=document.querySelectorAll('[data-action="beam"]');
  if(beamButtons.length){
    beamButtons.forEach(button=>{
      const usingBlink = player.beamCooldown > 0;
      const slotReady = usingBlink ? player.blinkCooldown === 0 : player.beamCooldown === 0;
      button.dataset.action = usingBlink ? "blink" : "beam";
      button.textContent = usingBlink ? "BLINK" : "BEAM";
      button.classList.toggle("cooldown", !slotReady);
    });

    const nineReady=player.nineTailsCooldown===0;
    nineButtons.forEach(button=>button.classList.toggle("cooldown",!nineReady && !nineActive));
  }
}

function damagePlayer(amount=1){
  if(player.invulnerable>0 || state!=="playing"){
    return false;
  }

  player.hp-=amount;
  player.invulnerable=75;

  shake=12;

  burst(
    player.x+player.width/2,
    player.y+player.height/2,
    28,
    "damage"
  );

  if(player.hp<=0){
    state="gameover";
  }

  return true;
}

   Attack
------------------------- */

function fireRasengan(){
  if(
    state!=="playing"
  ){
    return;
  }

  const nineTails=player.nineTailsTimer>0;
  player.attackCooldown=0;
  player.attackPose=8;
  player.vx+=player.direction*1.4;

  const startX=
    player.x+
    player.width/2+
    player.direction*38;

  const startY=
    player.y+
    player.height*.45;
  const aim=getPlayerAimVector(startX,startY,nineTails ? 15 : 11);

  projectiles.push({
    x:startX,
    y:startY,
    vx:aim.vx,
    vy:aim.vy,
    radius:nineTails ? 17 : 13,
    life:90,
    rotation:0,
    damage:5
  });

  burst(
    startX,
    startY,
    12,
    "chakra"
  );
}

function getPlayerAimVector(startX,startY,speed){
  if(boss.hp<=0){
    return {vx:player.direction*speed,vy:0};
  }

  const targetX=boss.x+boss.width/2;
  const targetY=boss.y+boss.height*.42;
  const distance=Math.hypot(targetX-startX,targetY-startY) || 1;

  return {
    vx:(targetX-startX)/distance*speed,
    vy:(targetY-startY)/distance*speed
  };
}

function fireNineTailsBlast(){
  const startX=player.x+player.width/2+player.direction*42;
  const startY=player.y+player.height*.42;
  player.attackPose=14;
  const aim=getPlayerAimVector(startX,startY,13);

  projectiles.push({
    x:startX,
    y:startY,
    vx:aim.vx,
    vy:aim.vy,
    radius:26,
    life:75,
    rotation:0,
    damage:Math.round(10*difficulty.powerScale),
    type:"nineTails"
  });
}

function fireFireball(){
  if(
    player.fireCooldown>0 ||
    state!=="playing"
  ){
    return;
  }

  player.fireCooldown=45;
  player.attackPose=10;
  player.vx+=player.direction*1.1;

  const startX=player.x+player.width/2+player.direction*38;
  const startY=player.y+player.height*.38;
  const aim=getPlayerAimVector(startX,startY,10);

  fireballs.push({
    x:startX,
    y:startY,
    vx:aim.vx,
    vy:aim.vy,
    radius:16,
    life:75,
    rotation:0
  });

  burst(startX,startY,24,"fire");
}

function fireTornadoKick(){
  if(state!=="playing" || player.kickCooldown>0){
    return;
  }

  player.kickCooldown=52;
  player.kickPose=18;
  player.vx+=player.direction*2.2;

  const kickX=player.x+(player.direction>0 ? player.width : -112);
  const kickBox={x:kickX,y:player.y+14,width:112,height:player.height-18};
  tornadoKicks.push({x:player.x+player.width/2+player.direction*42,y:player.y+player.height*.53,direction:player.direction,life:16});

  if(boss.hp>0 && rectsOverlap(kickBox,boss)){
    const damage=Math.round(17*difficulty.powerScale);
    boss.hp-=damage;
    boss.hitFlash=14;
    boss.vx=player.direction*4.5;
    score+=55;
    shake=10;
    burst(kickBox.x+kickBox.width/2,kickBox.y+kickBox.height/2,32,"kick");

    if(boss.hp<=0){
      score+=500;
      state="won";
      burst(boss.x+boss.width/2,boss.y+boss.height/2,90,"win");
    }
  }
}

function fireThunderstorm(owner){
  if(state!=="playing"){
    return;
  }

  if(owner==="player"){
    if(player.thunderCooldown>0){
      return;
    }
    player.thunderCooldown=480;
  }

  const target=owner==="player" ? boss : player;
  thunderStrikes.push({
    x:target.x+target.width/2,
    y:target.y+target.height*.45,
    owner,
    damage:owner==="player"
      ? 20
      : Math.round(50*difficulty.enemyPowerScale),
    warning:45,
    rotation:Math.random()*Math.PI*2,
    resolved:false
  });
  burst(target.x+target.width/2,target.y+target.height*.45,26,"thunder");
}

function fireKamehameha(owner){
  if(state!=="playing"){
    return;
  }

  const isPlayer=owner==="player";
  const fighter=isPlayer ? player : boss;
  const cooldown=isPlayer ? 360 : difficulty.enemyBeamCooldown;
  if(fighter.beamCooldown>0){
    return;
  }

  const direction=isPlayer
    ? player.direction
    : Math.sign(player.x-boss.x) || -1;
  const startX=fighter.x+fighter.width/2+direction*34;
  const startY=fighter.y+fighter.height*.4;

  fighter.beamCooldown=cooldown;
  fighter.attackPose=isPlayer ? 24 : 18;
  fighter.vx+=direction*(isPlayer ? 1.4 : .8);
  shake=isPlayer ? 8 : 6;

  beamAttacks.push({
    owner,
    x:startX,
    y:startY,
    direction,
    charge:24,
    life:18,
    hit:false,
    damage:isPlayer
      ? 30
      : Math.round(difficulty.projectileDamage*difficulty.enemyPowerScale*1.7),
    rotation:Math.random()*Math.PI*2
  });

  burst(startX,startY,isPlayer ? 34 : 26,isPlayer ? "chakra" : "painAttack");
}

function firePainProjectile(angleOffset=0){
  const startX=boss.x+boss.width/2;
  const startY=boss.y+boss.height*.42;
  const targetX=player.x+player.width/2;
  const targetY=player.y+player.height*.45;
  const distance=Math.hypot(targetX-startX,targetY-startY) || 1;
  const angle=Math.atan2(targetY-startY,targetX-startX)+angleOffset;
  const speed=5.5;

  enemyProjectiles.push({
    x:startX,
    y:startY,
    vx:Math.cos(angle)*difficulty.projectileSpeed,
    vy:Math.sin(angle)*difficulty.projectileSpeed,
    radius:12,
    life:150,
    rotation:0,
    type:"painAttack"
  });

  burst(startX,startY,14,"painAttack");
}

function firePainShockwave(){
  const direction=Math.sign(player.x-boss.x) || -1;
  enemyProjectiles.push({
    x:boss.x+boss.width/2+direction*34,
    y:boss.y+boss.height-18,
    vx:direction*7.2,
    vy:0,
    radius:17,
    life:120,
    rotation:0,
    type:"painWave",
    damage:Math.round(difficulty.projectileDamage*.8)
  });
  burst(boss.x+boss.width/2,boss.y+boss.height-18,20,"painAttack");
}

function firePainShurikenBurst(){
  const startX=boss.x+boss.width/2;
  const startY=boss.y+boss.height*.42;
  const targetX=player.x+player.width/2;
  const targetY=player.y+player.height*.45;
  const baseAngle=Math.atan2(targetY-startY,targetX-startX);

  for(let index=-2;index<=2;index++){
    const angle=baseAngle+index*.16;
    enemyProjectiles.push({
      x:startX,
      y:startY,
      vx:Math.cos(angle)*6.2,
      vy:Math.sin(angle)*6.2,
      radius:9,
      life:125,
      rotation:angle,
      type:"painShuriken",
      damage:Math.round(difficulty.projectileDamage*.7)
    });
  }
  burst(startX,startY,22,"painAttack");
}

function launchPainToWood(){
  if(!boss.grounded || Math.random()>.4){
    return;
  }

  const targetX=clamp(
    player.x+(boss.x>player.x ? 150 : -150),
    90,
    GAME.width-90
  );

  boss.vy=-14;
  boss.grounded=false;
  boss.jumpCooldown=90;
  boss.vx=clamp(
    (targetX-boss.x)*.035,
    -3.8,
    3.8
  );

  burst(
    boss.x+boss.width/2,
    boss.y+boss.height/2,
    24,
    "hit"
  );
}

/* -------------------------
   Projectiles
------------------------- */

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const shot=projectiles[i];

    shot.x+=shot.vx;
    shot.y+=shot.vy || 0;
    shot.rotation+=.3;
    shot.life--;

    if(
      shot.life<=0 ||
      shot.x<-60 ||
      shot.x>GAME.width+60
    ){
      projectiles.splice(i,1);
      continue;
    }

    const hitbox={
      x:shot.x-shot.radius,
      y:shot.y-shot.radius,
      width:shot.radius*2,
      height:shot.radius*2
    };

    const damage=shot.damage || difficulty.projectileDamage;

    const bossBox={
      x:boss.x,
      y:boss.y,
      width:boss.width,
      height:boss.height
    };

    if(
      boss.hp>0 &&
      rectsOverlap(hitbox,bossBox)
    ){
      boss.hp-=shot.damage;
      boss.hitFlash=10;
      if(shot.type==="nineTails"){
        playSound(sounds.nineTails);
      }
      launchPainToWood();

      score+=25;
      shake=7;

      burst(
        shot.x,
        shot.y,
        25,
        "hit"
      );

      projectiles.splice(i,1);

      if(boss.hp<=0){
        score+=500;
        state="won";

        burst(
          boss.x+boss.width/2,
          boss.y+boss.height/2,
          90,
          "win"
        );
      }
    }
  }
}

function updateBeamAttacks(){
  for(let index=beamAttacks.length-1;index>=0;index--){
    const beam=beamAttacks[index];
    beam.rotation+=.22;

    if(beam.charge>0){
      beam.charge--;
      continue;
    }

    beam.life--;
    const target=beam.owner==="player" ? boss : player;
    const beamBox={
      x:beam.direction>0 ? beam.x : beam.x-620,
      y:beam.y-28,
      width:620,
      height:56
    };
    const targetBox={x:target.x,y:target.y,width:target.width,height:target.height};

    if(!beam.hit && target.hp>0 && rectsOverlap(beamBox,targetBox)){
      beam.hit=true;
      if(beam.owner==="player"){
        boss.hp-=beam.damage;
        boss.hitFlash=26;
        score+=140;
        burst(boss.x+boss.width/2,boss.y+boss.height*.45,58,"chakra");
        if(boss.hp<=0){
          score+=500;
          state="won";
          burst(boss.x+boss.width/2,boss.y+boss.height/2,90,"win");
        }
      }else if(damagePlayer(beam.damage)){
        playPainAttackSound();
        burst(player.x+player.width/2,player.y+player.height*.45,52,"damage");
      }
      shake=18;
    }

    if(beam.life<=0){
      beamAttacks.splice(index,1);
    }
  }
}

function updateFireballs(){
  for(let i=fireballs.length-1;i>=0;i--){
    const shot=fireballs[i];

    shot.x+=shot.vx;
    shot.y+=shot.vy || 0;
    shot.rotation+=.25;
    shot.life--;

    if(
      shot.life<=0 ||
      shot.x<-60 ||
      shot.x>GAME.width+60
    ){
      fireballs.splice(i,1);
      continue;
    }

    const hitbox={
      x:shot.x-shot.radius,
      y:shot.y-shot.radius,
      width:shot.radius*2,
      height:shot.radius*2
    };

    const bossBox={
      x:boss.x,
      y:boss.y,
      width:boss.width,
      height:boss.height
    };

    if(boss.hp>0 && rectsOverlap(hitbox,bossBox)){
      boss.hp-=Math.round(8*difficulty.powerScale);
      boss.hitFlash=12;
      launchPainToWood();
      score+=40;
      shake=9;
      burst(shot.x,shot.y,35,"fire");
      fireballs.splice(i,1);

      if(boss.hp<=0){
        score+=500;
        state="won";
        burst(
          boss.x+boss.width/2,
          boss.y+boss.height/2,
          90,
          "win"
        );
      }
    }
  }
}

function updateTornadoKicks(){
  for(let i=tornadoKicks.length-1;i>=0;i--){
    tornadoKicks[i].life--;
    if(tornadoKicks[i].life<=0){
      tornadoKicks.splice(i,1);
    }
  }
}

function updateThunderstorms(){
  for(let i=thunderStrikes.length-1;i>=0;i--){
    const strike=thunderStrikes[i];
    strike.warning--;
    strike.rotation+=.35;

    if(strike.warning<=0 && !strike.resolved){
      strike.resolved=true;

      if(strike.owner==="player" && boss.hp>0){
        boss.hp-=strike.damage;
        boss.hitFlash=20;
        score+=100;
        shake=18;
        burst(strike.x,strike.y,60,"thunder");

        if(boss.hp<=0){
          score+=500;
          state="won";
          burst(boss.x+boss.width/2,boss.y+boss.height/2,90,"win");
        }
      }else if(strike.owner==="boss"){
        if(damagePlayer(strike.damage)){
          playPainAttackSound();
        }
        shake=18;
        burst(strike.x,strike.y,60,"thunder");
      }
    }

    if(strike.warning<=-16){
      thunderStrikes.splice(i,1);
    }
  }
}

function updateEnemyProjectiles(){
  for(let i=enemyProjectiles.length-1;i>=0;i--){
    const shot=enemyProjectiles[i];

    shot.x+=shot.vx;
    shot.y+=shot.vy;
    shot.rotation+=.24;
    shot.life--;

    const hitbox={
      x:shot.x-shot.radius,
      y:shot.y-shot.radius,
      width:shot.radius*2,
      height:shot.radius*2
    };

    const damage=shot.damage || difficulty.projectileDamage;

    if(
      shot.life<=0 ||
      shot.x<-60 ||
      shot.x>GAME.width+60 ||
      shot.y<-60 ||
      shot.y>GAME.height+60
    ){
      enemyProjectiles.splice(i,1);
      continue;
    }

    if(rectsOverlap(hitbox,player)){
      if(damagePlayer(damage)){
        playPainAttackSound();
      }
      burst(shot.x,shot.y,22,"damage");
      enemyProjectiles.splice(i,1);
    }
  }
}

/* -------------------------
   Boss
------------------------- */

function updateBoss(){
  if(boss.hp<=0){
    return;
  }

  if(boss.blinkCooldown>0){
    boss.blinkCooldown--;
  }

  if(boss.blinkFlash>0){
    boss.blinkFlash--;
  }

  if(Math.abs(player.x-boss.x)>260 && boss.blinkCooldown===0){
    triggerBossBlink();
  }

  const wasGrounded=boss.grounded;
  const enraged=boss.hp<=boss.maxHp/2;
  const targetDistance=player.x-boss.x;

  if(Math.abs(targetDistance)>110){
    boss.vx=Math.sign(targetDistance)*(enraged ? difficulty.bossSpeed+0.45 : difficulty.bossSpeed);
  }

  boss.x+=boss.vx;
  boss.previousY=boss.y;

  if(boss.aiTimer>0){
    boss.aiTimer--;
  }

  /* Pain chooses a flight pattern independently of player input. */
  if(boss.grounded && boss.aiTimer===0 && boss.jumpCooldown===0){
    const ambushSide=player.x<boss.x ? -1 : 1;
    boss.flightTargetY=230+(Math.sin(frame*.013)*70);
    boss.flightTargetX=clamp(player.x+ambushSide*190,120,GAME.width-120);
    boss.flightTimer=105+Math.floor(Math.random()*65);
    boss.vy=-11;
    boss.flying=true;
    boss.grounded=false;
    boss.jumpCooldown=150;
    boss.aiTimer=180+Math.floor(Math.random()*180);
    boss.vx=ambushSide*(difficulty.bossSpeed+1.2);
  }

  if(boss.flying){
    boss.flightTimer--;
    const heightDifference=clamp(boss.flightTargetY-boss.y,-7,7);
    boss.vy+=(heightDifference-boss.vy)*.14;
    boss.vx+=(clamp(boss.flightTargetX-boss.x,-6,6)-boss.vx)*.08;
    if(boss.flightTimer<=0){
      boss.flying=false;
    }
  }else{
    boss.vy+=GAME.gravity;
  }
  boss.y+=boss.vy;
  boss.grounded=false;

  const previousBottom=boss.previousY+boss.height;
  const currentBottom=boss.y+boss.height;

  if(boss.vy>=0){
    for(const platform of platforms){
      const horizontalOverlap=
        boss.x+boss.width>platform.x &&
        boss.x<platform.x+platform.width;
      const crossedTop=
        previousBottom<=platform.y &&
        currentBottom>=platform.y;

      if(horizontalOverlap && crossedTop){
        boss.y=platform.y-boss.height;
        boss.vy=0;
        boss.grounded=true;
        boss.flying=false;
        if(!wasGrounded){
          boss.landSquash=1;
        }
        break;
      }
    }
  }

  boss.animationTime+=Math.abs(boss.vx)>.15
    ? .13+Math.abs(boss.vx)*.035
    : .025;
  boss.landSquash=Math.max(0,boss.landSquash-.12);

  if(boss.y<54){
    boss.y=54;
    boss.vy=Math.max(0,boss.vy);
  }

  if(boss.jumpCooldown>0){
    boss.jumpCooldown--;
  }

  if(
    boss.x<boss.minX ||
    boss.x+boss.width>boss.maxX
  ){
    boss.vx*=-1;
  }

  if(boss.hitFlash>0){
    boss.hitFlash--;
  }

  if(boss.attackCooldown>0){
    boss.attackCooldown--;
  }

  if(boss.thunderCooldown>0){
    boss.thunderCooldown--;
  }else{
    fireThunderstorm("boss");
    boss.thunderCooldown=difficulty.painThunderDelay;
  }

  if(boss.beamCooldown>0){
    boss.beamCooldown--;
  }else if(Math.abs(targetDistance)<720){
    fireKamehameha("boss");
  }

  const bossBox={
    x:boss.x,
    y:boss.y,
    width:boss.width,
    height:boss.height
  };

  if(boss.attackCooldown===0){
    if(rectsOverlap(player,bossBox)){
      boss.attackCooldown=60;
      if(damagePlayer(difficulty.projectileDamage+2)){
        playPainAttackSound();
      }
    }else{
      boss.attackCooldown=enraged ? Math.max(34,difficulty.attackDelay-24) : difficulty.attackDelay;
      const pattern=Math.floor(frame/Math.max(1,difficulty.attackDelay))%3;

      if(pattern===0){
        firePainProjectile();
        if(enraged){
          firePainProjectile(-.22);
          firePainProjectile(.22);
        }
      }else if(pattern===1){
        firePainShockwave();
        if(enraged){
          firePainProjectile();
        }
      }else{
        firePainShurikenBurst();
      }

      if(enraged){
        shake=10;
      }
    }
  }
}

/* -------------------------
   Chakra Orbs
------------------------- */

function updateOrbs(){
  for(const orb of orbs){
    orb.phase+=.05;

    if(orb.collected){
      continue;
    }

    const box={
      x:orb.x-14,
      y:orb.y-14,
      width:28,
      height:28
    };

    if(rectsOverlap(player,box)){
      orb.collected=true;
      score+=100;

      burst(
        orb.x,
        orb.y,
        25,
        "orb"
      );
    }
  }
}

/* -------------------------
   Particles
------------------------- */

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const particle=particles[i];

    particle.x+=particle.vx;
    particle.y+=particle.vy;

    particle.vy+=.08;
    particle.life-=.025;

    if(particle.life<=0){
      particles.splice(i,1);
    }
  }
}

/* -------------------------
   Drawing: background
------------------------- */

function drawBackground(){
  const sky=ctx.createLinearGradient(
    0,0,0,GAME.height
  );

  sky.addColorStop(0,"#050313");
  sky.addColorStop(.45,"#160e2b");
  sky.addColorStop(1,"#03040b");

  ctx.fillStyle=sky;
  ctx.fillRect(
    0,0,
    GAME.width,
    GAME.height
  );

  /* Hazy moonlight behind the forest. */
  const moonGlow=ctx.createRadialGradient(580,135,12,580,135,310);
  moonGlow.addColorStop(0,"rgba(154,111,255,.25)");
  moonGlow.addColorStop(1,"rgba(154,111,255,0)");
  ctx.fillStyle=moonGlow;
  ctx.fillRect(270,-80,620,430);

  /* Animated nebula clouds and an eclipse give the arena a darker sci-fi mood. */
  ctx.save();
  ctx.globalCompositeOperation="screen";
  const nebulaShift=Math.sin(frame*.006)*85;
  const violetCloud=ctx.createRadialGradient(230+nebulaShift,210,10,230+nebulaShift,210,290);
  violetCloud.addColorStop(0,"rgba(146,38,210,.28)");
  violetCloud.addColorStop(1,"rgba(40,11,79,0)");
  ctx.fillStyle=violetCloud;
  ctx.fillRect(-80,-40,620,520);

  const redCloud=ctx.createRadialGradient(930-nebulaShift,250,10,930-nebulaShift,250,260);
  redCloud.addColorStop(0,"rgba(226,35,104,.2)");
  redCloud.addColorStop(1,"rgba(71,8,50,0)");
  ctx.fillStyle=redCloud;
  ctx.fillRect(650,0,550,520);
  ctx.restore();

  ctx.save();
  ctx.translate(940,145);
  ctx.rotate(-.16+Math.sin(frame*.004)*.04);
  ctx.strokeStyle="rgba(255,93,184,.35)";
  ctx.lineWidth=11;
  ctx.beginPath();
  ctx.ellipse(0,0,108,28,0,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle="#090817";
  ctx.shadowBlur=28;
  ctx.shadowColor="#ff2f9d";
  ctx.beginPath();
  ctx.arc(0,0,46,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* Low mist bands give the arena depth without expensive assets. */
  ctx.save();
  ctx.globalAlpha=.13;
  for(let band=0;band<4;band++){
    ctx.fillStyle=band%2 ? "#a0d5cc" : "#5f9ca1";
    ctx.beginPath();
    ctx.moveTo(0,300+band*62);
    for(let x=0;x<=GAME.width;x+=80){
      ctx.quadraticCurveTo(x+40,278+band*62+Math.sin(x*.02+band)*14,x+80,300+band*62);
    }
    ctx.lineTo(GAME.width,450+band*62);
    ctx.lineTo(0,450+band*62);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* Tall layered trees, kept as simple paths for mobile performance. */
  function tree(x,top,width,color,alpha){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;
    ctx.fillRect(x-width*.055,top,width*.11,400-top);
    ctx.strokeStyle=color;
    ctx.lineCap="round";
    ctx.lineWidth=Math.max(5,width*.07);
    for(let branch=0;branch<4;branch++){
      const branchY=top+55+branch*43;
      ctx.beginPath();
      ctx.moveTo(x,branchY+35);
      ctx.lineTo(x-width*(.25+.06*branch),branchY-24);
      ctx.lineTo(x-width*(.5+.07*branch),branchY-42);
      ctx.moveTo(x,branchY+45);
      ctx.lineTo(x+width*(.22+.05*branch),branchY-12);
      ctx.lineTo(x+width*(.48+.07*branch),branchY-32);
      ctx.stroke();
    }
    ctx.fillStyle=color;
    for(let leaf=0;leaf<5;leaf++){
      ctx.beginPath();
      ctx.ellipse(
        x-width*.34+leaf*width*.17,
        top+28+(leaf%2)*34,
        width*.26,
        width*.12,
        (leaf-2)*.16,
        0,
        Math.PI*2
      );
      ctx.fill();
    }
    ctx.restore();
  }

  for(let treeIndex=0;treeIndex<17;treeIndex++){
    const x=treeIndex*79-35;
    tree(x,75+(treeIndex%4)*24,72+(treeIndex%3)*18,"#20183b",.3);
  }
  for(let treeIndex=0;treeIndex<12;treeIndex++){
    const x=treeIndex*113+32;
    tree(x,112+(treeIndex%3)*30,92+(treeIndex%2)*22,"#070713",.48);
  }

  /* Soft firefly specks instead of a star field. */
  for(const star of stars){
    const starX=(star.x+frame*star.speed*4)%GAME.width;
    const alpha=
      .35+
      .5*Math.sin(
        frame*star.speed+
        star.phase
      );

    ctx.globalAlpha=alpha;
    ctx.fillStyle=star.phase%2>.5 ? "#ff9edc" : "#a9d9ff";

    ctx.beginPath();
    ctx.arc(
      starX,
      star.y,
      star.r,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;

  /* A few diagonal moon rays echo the reference scene. */
  ctx.save();
  ctx.globalAlpha=.1;
  ctx.fillStyle="#a9f4e8";
  for(let ray=0;ray<5;ray++){
    ctx.beginPath();
    ctx.moveTo(120+ray*245,40);
    ctx.lineTo(225+ray*245,40);
    ctx.lineTo(75+ray*245,520);
    ctx.lineTo(0+ray*245,520);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* Cinematic edge falloff keeps the arena focused on the fighters. */
  const vignette=ctx.createRadialGradient(
    GAME.width/2,GAME.height*.48,180,
    GAME.width/2,GAME.height*.48,720
  );
  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(1,"rgba(0,5,9,.48)");
  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,GAME.width,GAME.height);

  /* Rare distant lightning flash */
  const lightningPhase=frame%420;
  if(lightningPhase>398 && lightningPhase<405){
    ctx.save();
    ctx.globalAlpha=(405-lightningPhase)*.035;
    ctx.fillStyle="#d8f4ff";
    ctx.fillRect(0,0,GAME.width,GAME.height);
    ctx.restore();
  }
}

/* -------------------------
   Drawing: platforms
------------------------- */

function drawPlatforms(){
  for(const platform of platforms){
    /* shadow */
    ctx.fillStyle="rgba(0,0,0,.40)";
    ctx.fillRect(
      platform.x,
      platform.y+8,
      platform.width,
      platform.height
    );

    if(platform.type==="ground"){
      const ground=ctx.createLinearGradient(
        0,platform.y,
        0,GAME.height
      );

      ground.addColorStop(0,"#173d3d");
      ground.addColorStop(1,"#07171b");

      ctx.fillStyle=ground;
      ctx.fillRect(
        platform.x,
        platform.y,
        platform.width,
        platform.height
      );

      /* Mossy top edge keeps the landing line readable. */
      ctx.fillStyle="#77d0b1";
      ctx.fillRect(
        platform.x,
        platform.y,
        platform.width,
        7
      );

      /* Staggered stone blocks make the bottom feel like a real arena floor. */
      const brickRows=[
        {y:platform.y+11,height:20,width:92,offset:0},
        {y:platform.y+32,height:22,width:118,offset:-48},
        {y:platform.y+55,height:22,width:82,offset:-12}
      ];

      for(const row of brickRows){
        for(let x=platform.x+row.offset;x<platform.x+platform.width;x+=row.width){
          const brickX=Math.max(platform.x,x+2);
          const brickRight=Math.min(platform.x+platform.width,x+row.width-3);
          ctx.fillStyle=(Math.floor((x+row.y)*.07)%2===0)
            ? "#123436"
            : "#0d292e";
          ctx.fillRect(
            brickX,
            row.y,
            Math.max(12,brickRight-brickX),
            row.height-2
          );
        }
      }

      ctx.strokeStyle="rgba(4,15,19,.9)";
      ctx.lineWidth=3;
      for(let row=0;row<3;row++){
        const seamY=platform.y+31+row*23;
        ctx.beginPath();
        ctx.moveTo(platform.x,seamY);
        ctx.lineTo(platform.x+platform.width,seamY);
        ctx.stroke();
      }

      ctx.strokeStyle="rgba(71,137,116,.45)";
      ctx.lineWidth=1.5;
      for(let crack=0;crack<14;crack++){
        const crackX=platform.x+34+crack*91;
        const crackY=platform.y+18+(crack%3)*23;
        ctx.beginPath();
        ctx.moveTo(crackX,crackY);
        ctx.lineTo(crackX+7,crackY+4);
        ctx.lineTo(crackX+3,crackY+9);
        ctx.stroke();
      }

      ctx.globalAlpha=.32;
      ctx.strokeStyle="#73b89f";
      ctx.lineWidth=2;
      for(let line=0;line<7;line++){
        const startX=90+line*185;
        ctx.beginPath();
        ctx.moveTo(startX,platform.y+4);
        ctx.quadraticCurveTo(startX+18,platform.y-9,startX+36,platform.y+4);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }else{
      const wood=ctx.createLinearGradient(
        0,platform.y,
        0,platform.y+platform.height
      );

      wood.addColorStop(0,"#553127");
      wood.addColorStop(1,"#1c1418");

      ctx.fillStyle=wood;
      ctx.fillRect(
        platform.x,
        platform.y,
        platform.width,
        platform.height
      );

      ctx.fillStyle="#db9b4c";
      ctx.fillRect(
        platform.x,
        platform.y,
        platform.width,
        5
      );

      ctx.fillStyle="#9b5b35";

      for(
        let x=platform.x+10;
        x<platform.x+platform.width;
        x+=22
      ){
        ctx.fillRect(
          x,
          platform.y+9,
          3,
          7
        );
      }
    }
  }
}

/* -------------------------
   Drawing helpers
------------------------- */

function drawGlow(x,y,r,color){
  if(PERFORMANCE.low){
    ctx.save();
    ctx.globalAlpha=.28;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,r*.55,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    return;
  }

  const gradient=ctx.createRadialGradient(
    x,y,0,
    x,y,r
  );

  gradient.addColorStop(0,color);
  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();
  ctx.arc(
    x,y,r,
    0,Math.PI*2
  );
  ctx.fill();
}

function drawFlightEffects(x,y,width,height,color,phase,direction){
  const centerX=x+width/2;
  const centerY=y+height*.72;
  const trailX=centerX-direction*28;

  drawGlow(centerX,centerY,92,color);

  ctx.save();
  ctx.globalAlpha=.7;
  ctx.lineCap="round";
  for(let ribbon=0;ribbon<3;ribbon++){
    const wave=phase*1.8+ribbon*1.7;
    ctx.strokeStyle=color;
    ctx.lineWidth=3-ribbon*.5;
    ctx.beginPath();
    ctx.moveTo(trailX,y+height*.48+ribbon*8);
    ctx.quadraticCurveTo(
      trailX-direction*(34+Math.sin(wave)*12),
      y+height*.7+Math.cos(wave)*14,
      trailX-direction*(76+ribbon*14),
      y+height*.58+Math.sin(wave)*20
    );
    ctx.stroke();
  }

  ctx.globalAlpha=.38;
  ctx.strokeStyle="#f5ffff";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(centerX,centerY+height*.48,34+Math.sin(phase)*6,8,0,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha=.22;
  ctx.fillStyle="#02050c";
  ctx.beginPath();
  ctx.ellipse(centerX,y+height+22,34,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCharacterImage(
  image,
  x,y,
  width,height,
  flip=false,
  rotation=0,
  scaleX=1
){
  ctx.save();

  ctx.translate(
    x+width/2,
    y+height/2
  );

  if(flip){
    ctx.scale(-1,1);
  }

  ctx.rotate(rotation);
  ctx.scale(scaleX,1);

  ctx.beginPath();
  ctx.roundRect(
    -width/2,
    -height/2,
    width,
    height,
    13
  );
  ctx.clip();

  if(
    image.complete &&
    image.naturalWidth>0
  ){
    ctx.drawImage(
      image,
      -width/2,
      -height/2,
      width,
      height
    );
  }else{
    ctx.fillStyle="#222";
    ctx.fillRect(
      -width/2,
      -height/2,
      width,
      height
    );
  }

  ctx.restore();
}

function drawShadowFighter(
  x,y,width,height,kind,direction,phase,attack,kick,airborne,hitFlash,landSquash=0,motion=1
){
  const isNaruto=kind==="naruto";
  const walkAmount=clamp(motion,0,1);
  const gait=Math.sin(phase)*walkAmount;
  const gaitOpp=-gait;
  const run=Math.sin(phase)*.28;
  const attackAmount=attack>0
    ? Math.min(1,attack/8)
    : 0;
  const kickAmount=kick>0 ? Math.min(1,kick/8) : 0;
  const combatPose=attackAmount>0 || kickAmount>0;
  const running=walkAmount>.08 && !airborne && !combatPose;
  const locomotion=running ? gait : 0;
  const landing=landSquash*.12;
  const lean=airborne
    ? -direction*.08
    : direction*(combatPose ? .12 : running ? .055*clamp(motion,0,1) : .018)+landing*direction;
  const accent=isNaruto ? "#ff8b2d" : "#ff3fc8";
  const glow=isNaruto
    ? "rgba(255,95,25,.35)"
    : "rgba(205,35,255,.48)";

  drawGlow(
    x+width/2,
    y+height/2,
    isNaruto ? 76 : 82,
    glow
  );

  ctx.save();
  ctx.translate(x+width/2,y+height/2);
  ctx.scale(direction,1);
  ctx.translate(locomotion*width*.045,-Math.abs(locomotion)*height*.018);
  ctx.rotate(lean);
  ctx.scale(1+landing*.18,1-landing*.16);
  ctx.beginPath();
  ctx.rect(-width/2,-height/2,width,height);
  ctx.clip();
  ctx.lineCap="round";
  ctx.lineJoin="round";

  const headY=-height*.35;
  const shoulderY=-height*.11;
  const hipY=height*.22;
  const footY=height*.5;

  /* Dark readable silhouette with small character-color accents. */
  ctx.fillStyle="#071217";
  ctx.strokeStyle=isNaruto ? "#8d2d18" : "#05020a";
  ctx.lineWidth=10;

  ctx.beginPath();
  ctx.arc(0,headY,height*.14,0,Math.PI*2);
  ctx.fill();

  if(isNaruto){
    ctx.fillStyle="#d88a55";
    ctx.beginPath();
    ctx.arc(0,headY+height*.025,height*.105,0,Math.PI*2);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.moveTo(0,shoulderY);
  ctx.lineTo(0,hipY);
  ctx.stroke();

  ctx.fillStyle=isNaruto ? "#17252b" : "#0d0715";
  ctx.beginPath();
  ctx.moveTo(-width*.14,shoulderY);
  ctx.lineTo(width*.14,shoulderY);
  ctx.lineTo(width*.11,hipY);
  ctx.lineTo(-width*.11,hipY);
  ctx.closePath();
  ctx.fill();

  if(isNaruto){
    ctx.fillStyle="#f47b24";
    ctx.beginPath();
    ctx.ellipse(0,shoulderY+height*.18,width*.2,height*.3,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.lineWidth=8;
  ctx.beginPath();
  const stride=airborne ? -.15 : run;
  ctx.moveTo(0,hipY);
  ctx.lineTo(-width*.22+stride*width,footY);
  ctx.moveTo(0,hipY);
  ctx.lineTo(width*.22-stride*width,footY);
  ctx.stroke();

  const guardElbow={
    x:-width*(.27+locomotion*.07),
    y:shoulderY+height*(.10+locomotion*.06)
  };
  const guardHand={
    x:-width*(.34+locomotion*.1),
    y:shoulderY+height*(.22+locomotion*.08)
  };
  const punchElbow={
    x:width*(.27+locomotion*.07+.14*attackAmount),
    y:shoulderY+height*(.10-locomotion*.06-.10*attackAmount)
  };
  const punchHand={
    x:width*(.34+locomotion*.1+.42*attackAmount),
    y:shoulderY+height*(.22-locomotion*.08-.20*attackAmount)
  };

  ctx.beginPath();
  ctx.moveTo(0,shoulderY);
  ctx.lineTo(guardElbow.x,guardElbow.y);
  ctx.lineTo(guardHand.x,guardHand.y);
  ctx.moveTo(0,shoulderY);
  ctx.lineTo(punchElbow.x,punchElbow.y);
  ctx.lineTo(punchHand.x,punchHand.y);
  ctx.stroke();

  if(kickAmount>0){
    ctx.strokeStyle=accent;
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(width*.04,hipY);
    ctx.lineTo(width*(.38+.25*kickAmount),height*(.23-.16*kickAmount));
    ctx.lineTo(width*(.68+.18*kickAmount),height*(.22-.20*kickAmount));
    ctx.stroke();
  }

  /* Colored fighter edge and headband */
  ctx.strokeStyle=accent;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-width*.14,headY-height*.12);
  ctx.lineTo(width*.14,headY-height*.12);
  ctx.stroke();

  ctx.fillStyle=accent;
  ctx.fillRect(
    -width*.16,
    headY-height*.08,
    width*.32,
    4
  );

  if(isNaruto){
    ctx.globalAlpha=.8;
    ctx.strokeStyle="#ffd06a";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-width*.18,shoulderY+height*.08);
    ctx.lineTo(-width*.06,hipY-height*.02);
    ctx.moveTo(width*.18,shoulderY+height*.08);
    ctx.lineTo(width*.06,hipY-height*.02);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  if(isNaruto){
    ctx.strokeStyle="#ffb13b";
    ctx.lineWidth=3;
    for(let spike=0;spike<5;spike++){
      ctx.beginPath();
      ctx.moveTo(-width*.12+spike*width*.06,headY-height*.42);
      ctx.lineTo(-width*.2+spike*width*.1,headY-height*.6);
      ctx.stroke();
    }
  }else{
    ctx.strokeStyle="#ff3c6e";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-width*.11,headY);
    ctx.lineTo(width*.11,headY);
    ctx.stroke();

    ctx.strokeStyle="#55f5ff";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,shoulderY+height*.1,width*.34,0,Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle="#ff3fc8";
    ctx.beginPath();
    ctx.arc(0,shoulderY+height*.1,width*.25,0,Math.PI*2);
    ctx.stroke();
  }

  if(hitFlash>0){
    ctx.globalAlpha=.7;
    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;
    ctx.strokeRect(-width*.45,-height*.5,width*.9,height);
  }

  ctx.restore();
}

function drawOrbs(){
  for(const orb of orbs){
    if(orb.collected){
      continue;
    }

    const y=
      orb.y+
      Math.sin(orb.phase)*7;

    drawGlow(
      orb.x,
      y,
      38,
      "rgba(70,205,255,.34)"
    );

    ctx.save();

    ctx.translate(
      orb.x,
      y
    );

    ctx.rotate(orb.phase);

    ctx.fillStyle="#91ecff";

    ctx.beginPath();
    ctx.arc(
      0,0,12,
      0,Math.PI*2
    );
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.globalAlpha=.85;
    ctx.fillRect(-4,-7,3,6);

    ctx.restore();
    ctx.globalAlpha=1;
  }
}

/* -------------------------
   Drawing: Naruto
------------------------- */

function drawPlayer(){
  const x=player.x;
  const y=player.y;
  const running=Math.abs(player.vx)>.15;
  const runBob=running
    ? Math.abs(Math.sin(player.animationTime))*2.2
    : Math.sin(frame*.08)*.7;

  const cx=
    x+
    player.width/2;

  const cy=
    y+
    player.height/2;

  if(
    player.invulnerable>0 &&
    Math.floor(
      player.invulnerable/5
    )%2===0
  ){
    ctx.globalAlpha=.35;
  }

  if(player.nineTailsTimer>0){
    drawGlow(
      cx,
      cy,
      98,
      "rgba(255,45,35,.48)"
    );

    ctx.save();
    ctx.strokeStyle="rgba(255,105,35,.8)";
    ctx.lineWidth=8;
    ctx.lineCap="round";

    for(let tail=0;tail<3;tail++){
      ctx.beginPath();
      ctx.moveTo(cx-18+tail*18,y+player.height-18);
      ctx.quadraticCurveTo(
        cx-52+tail*52,
        y-35-Math.sin(frame*.12+tail)*12,
        cx-12+tail*28,
        y-58
      );
      ctx.stroke();
    }

    ctx.restore();
  }

  /* Chakra aura */
  drawGlow(
    cx,
    cy,
    68,
    player.nineTailsTimer>0
      ? "rgba(255,35,35,.45)"
      : "rgba(255,145,40,.22)"
  );

  if(player.flying){
    drawFlightEffects(
      x,
      y,
      player.width,
      player.height,
      "rgba(255,111,40,.82)",
      player.animationTime,
      player.direction
    );
  }

  /* Shadow */
  ctx.fillStyle="rgba(0,0,0,.48)";
  ctx.beginPath();
  ctx.ellipse(
    cx,
    y+player.height+6,
    34,8,
    0,0,Math.PI*2
  );
  ctx.fill();

  drawShadowFighter(
    x,
    y-runBob,
    player.width,
    player.height,
    "naruto",
    player.direction,
    player.animationTime,
    player.attackPose,
    player.kickPose,
    !player.grounded,
    0,
    player.landSquash,
    Math.abs(player.vx)/player.maxSpeed
  );

  ctx.strokeStyle="#ff9d38";
  ctx.lineWidth=2;
  if(!PERFORMANCE.low){
    ctx.shadowBlur=10;
    ctx.shadowColor="#ff7518";
  }
  ctx.beginPath();
  ctx.ellipse(cx,y+player.height-3,25,5,0,0,Math.PI*2);
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}

/* -------------------------
   Drawing: Pain
------------------------- */

function drawBoss(){
  if(boss.hp<=0){
    return;
  }

  const cx=
    boss.x+
    boss.width/2;

  const cy=
    boss.y+
    boss.height/2;
  const bossMotion=Math.abs(boss.vy)>.5
    ? Math.sin(frame*.25)*3
    : Math.sin(frame*.1)*1.5;

  drawGlow(
    cx,
    cy,
    boss.hp<=boss.maxHp/2 ? 105 : 78,
    boss.hp<=boss.maxHp/2
      ? "rgba(255,20,155,.62)"
      : "rgba(205,35,255,.42)"
  );

  ctx.save();
  ctx.globalAlpha=.28+.12*Math.sin(frame*.14);
  ctx.strokeStyle=boss.hp<=boss.maxHp/2
    ? "#ff247d"
    : "#55f5ff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(cx,cy,50+Math.sin(frame*.1)*5,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  if(boss.hp<=boss.maxHp/2){
    ctx.save();
    ctx.fillStyle="#ff6bb5";
    ctx.font="bold 16px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAIN RAGE",cx,boss.y-34);
    ctx.restore();
  }

  if(boss.flying){
    drawFlightEffects(
      boss.x,
      boss.y,
      boss.width,
      boss.height,
      boss.hp<=boss.maxHp/2
        ? "rgba(255,44,174,.9)"
        : "rgba(137,89,255,.82)",
      boss.animationTime,
      -1
    );
  }

  drawShadowFighter(
    boss.x,
    boss.y-bossMotion,
    boss.width,
    boss.height,
    "pain",
    -1,
    boss.animationTime,
    0,
    0,
    Math.abs(boss.vy)>.5,
    boss.hitFlash,
    boss.landSquash,
    Math.abs(boss.vx)/Math.max(1,boss.speed)
  );

}

function drawBeamAttacks(){
  for(const beam of beamAttacks){
    const isPlayer=beam.owner==="player";
    const chargeProgress=clamp(1-beam.charge/24,0,1);
    const activeProgress=beam.charge<=0 ? clamp(beam.life/18,0,1) : 0;
    const color=isPlayer ? "#54d9ff" : "#e93dff";
    const core=isPlayer ? "#f2ffff" : "#ffd5ff";

    ctx.save();
    ctx.globalAlpha=beam.charge>0 ? .55+chargeProgress*.35 : .9;
    ctx.shadowBlur=beam.charge>0 ? 22 : 34;
    ctx.shadowColor=color;

    if(beam.charge>0){
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.arc(beam.x,beam.y,18+chargeProgress*24,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle=core;
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.arc(beam.x,beam.y,11+Math.sin(frame*.4)*3,beam.rotation,beam.rotation+4.8);
      ctx.stroke();
    }else{
      const endX=beam.x+beam.direction*620;
      const beamGradient=ctx.createLinearGradient(beam.x,beam.y,endX,beam.y);
      beamGradient.addColorStop(0,color);
      beamGradient.addColorStop(.12,core);
      beamGradient.addColorStop(.52,color);
      beamGradient.addColorStop(1,"rgba(0,0,0,0)");
      ctx.strokeStyle=beamGradient;
      ctx.lineWidth=58*activeProgress;
      ctx.beginPath();
      ctx.moveTo(beam.x,beam.y);
      ctx.lineTo(endX,beam.y);
      ctx.stroke();
      ctx.strokeStyle=core;
      ctx.lineWidth=12*activeProgress;
      ctx.beginPath();
      ctx.moveTo(beam.x,beam.y);
      ctx.lineTo(endX,beam.y);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawTornadoKicks(){
  for(const kick of tornadoKicks){
    const progress=1-kick.life/16;
    ctx.save();
    ctx.translate(kick.x,kick.y);
    ctx.scale(kick.direction,1);
    ctx.globalAlpha=Math.max(.15,1-progress);
    ctx.strokeStyle="#ffd166";
    ctx.lineWidth=5;
    ctx.shadowBlur=18;
    ctx.shadowColor="#ff8b2d";
    ctx.beginPath();
    ctx.arc(0,0,25+progress*48,-.95,.95);
    ctx.stroke();
    ctx.strokeStyle="#8fe8ff";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(4,0,39+progress*34,-.8,.8);
    ctx.stroke();
    ctx.restore();
  }
}

function drawThunderstorms(){
  for(const strike of thunderStrikes){
    const warningProgress=clamp(1-strike.warning/45,0,1);
    const impactProgress=strike.warning<=0
      ? clamp(1+strike.warning/16,0,1)
      : 0;

    ctx.save();
    ctx.globalAlpha=strike.warning>0 ? .45+.35*Math.sin(frame*.5) : 1-impactProgress;
    const isPainStrike=strike.owner==="boss";
    ctx.strokeStyle=isPainStrike ? "#ff68d5" : "#8fe8ff";
    ctx.lineWidth=3+warningProgress*4;
    if(!PERFORMANCE.low){
      ctx.shadowBlur=24;
      ctx.shadowColor=isPainStrike ? "#ff2fae" : "#47cfff";
    }
    ctx.beginPath();
    ctx.moveTo(strike.x,0);
    ctx.lineTo(strike.x-13,strike.y*.35);
    ctx.lineTo(strike.x+10,strike.y*.68);
    ctx.lineTo(strike.x,strike.y);
    ctx.stroke();

    ctx.strokeStyle=isPainStrike ? "#ffd0f4" : "#e9fbff";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(strike.x,strike.y,28+impactProgress*62,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawEnemyProjectiles(){
  for(const shot of enemyProjectiles){
    if(shot.type==="painWave"){
      ctx.save();
      ctx.globalAlpha=.9;
      ctx.strokeStyle="#ff4fd8";
      ctx.shadowBlur=18;
      ctx.shadowColor="#ff2bbd";
      ctx.lineWidth=6;
      ctx.beginPath();
      ctx.moveTo(shot.x-24,shot.y+8);
      ctx.quadraticCurveTo(shot.x,shot.y-22,shot.x+24,shot.y+8);
      ctx.stroke();
      ctx.strokeStyle="#ffd1f4";
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.restore();
      continue;
    }

    if(shot.type==="painShuriken"){
      ctx.save();
      ctx.translate(shot.x,shot.y);
      ctx.rotate(shot.rotation+frame*.12);
      ctx.fillStyle="#ff5ed8";
      ctx.strokeStyle="#ffd1f4";
      ctx.lineWidth=2;
      ctx.shadowBlur=14;
      ctx.shadowColor="#ff2bbd";
      ctx.beginPath();
      ctx.moveTo(0,-shot.radius*1.8);
      ctx.lineTo(shot.radius*.55,-shot.radius*.35);
      ctx.lineTo(shot.radius*1.8,0);
      ctx.lineTo(shot.radius*.55,shot.radius*.35);
      ctx.lineTo(0,shot.radius*1.8);
      ctx.lineTo(-shot.radius*.55,shot.radius*.35);
      ctx.lineTo(-shot.radius*1.8,0);
      ctx.lineTo(-shot.radius*.55,-shot.radius*.35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      continue;
    }

    drawGlow(
      shot.x,
      shot.y,
      34,
      "rgba(210,70,255,.55)"
    );

    ctx.save();
    ctx.translate(shot.x,shot.y);
    ctx.rotate(shot.rotation);

    ctx.fillStyle="#f1c5ff";
    ctx.beginPath();
    ctx.arc(0,0,shot.radius,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#b84cff";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.strokeStyle="#7c20c9";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,8,0,Math.PI*1.6);
    ctx.stroke();

    ctx.restore();
  }
}

/* -------------------------
   Drawing: particles
------------------------- */

function drawParticles(){
  for(const particle of particles){
    ctx.globalAlpha=
      Math.max(0,particle.life);

    if(particle.type==="damage"){
      ctx.fillStyle="#ff5864";
    }else if(particle.type==="hit"){
      ctx.fillStyle="#c86cff";
    }else if(particle.type==="jump"){
      ctx.fillStyle="#ffb33d";
    }else if(particle.type==="fire"){
      ctx.fillStyle="#ff6a1f";
    }else if(particle.type==="nineTails"){
      ctx.fillStyle="#ff392b";
    }else if(particle.type==="kick"){
      ctx.fillStyle="#ffd166";
    }else if(particle.type==="thunder"){
      ctx.fillStyle="#a8f3ff";
    }else if(particle.type==="orb"){
      ctx.fillStyle="#6edcff";
    }else{
      ctx.fillStyle="#9deaff";
    }

    ctx.beginPath();
    ctx.arc(
      particle.x,
      particle.y,
      particle.size*
        Math.max(
          particle.life,
          .2
        ),
      0,Math.PI*2
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* -------------------------
   Drawing: UI
------------------------- */

function drawUI(){
  updateAbilityButtons();
  displayedPlayerHp+=(player.hp-displayedPlayerHp)*.16;
  displayedBossHp+=(boss.hp-displayedBossHp)*.16;

  function drawHealthBar(x,y,width,value,color,label,reverse=false,actualValue=value){
    const ratio=clamp(value,0,1);
    const actualRatio=clamp(actualValue,0,1);
    ctx.fillStyle="rgba(4,12,17,.76)";
    ctx.beginPath();
    ctx.roundRect(x-8,y-8,width+16,42,21);
    ctx.fill();

    ctx.fillStyle="#26343a";
    ctx.beginPath();
    ctx.roundRect(x,y,width,12,6);
    ctx.fill();

    if(actualRatio<ratio){
      const trailWidth=width*(ratio-actualRatio);
      ctx.fillStyle="rgba(255,202,92,.7)";
      ctx.beginPath();
      ctx.roundRect(
        reverse ? x+width*(1-ratio) : x+width*actualRatio,
        y,
        trailWidth,
        12,
        6
      );
      ctx.fill();
    }

    const fillWidth=width*ratio;
    if(fillWidth>0){
      const sheen=ctx.createLinearGradient(x,y,x+width,y+12);
      sheen.addColorStop(0,color);
      sheen.addColorStop(.55,color);
      sheen.addColorStop(
        clamp(((frame*3)%width)/width,0,1),
        "rgba(255,255,255,.82)"
      );
      sheen.addColorStop(1,color);
      ctx.fillStyle=sheen;
      ctx.beginPath();
      ctx.roundRect(reverse ? x+width-fillWidth : x,y,fillWidth,12,6);
      ctx.fill();
    }

    if(ratio<.3){
      ctx.globalAlpha=.42+.32*Math.sin(frame*.22);
      ctx.strokeStyle="#ff5364";
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.roundRect(x-3,y-3,width+6,18,9);
      ctx.stroke();
      ctx.globalAlpha=1;
    }

    ctx.fillStyle="#f4ffff";
    ctx.font="bold 15px Arial";
    ctx.textAlign=reverse ? "right" : "left";
    ctx.fillText(label,reverse ? x+width : x,y-10);
    ctx.textAlign="left";
  }

  drawHealthBar(
    86,31,310,
    displayedPlayerHp/player.maxHp,
    "#38d4bd",
    `NARUTO  ${player.hp}/${player.maxHp}`,
    false,
    player.hp/player.maxHp
  );

  drawHealthBar(
    GAME.width-396,31,310,
    displayedBossHp/boss.maxHp,
    "#e65361",
    `PAIN  ${boss.hp}/${boss.maxHp}`,
    true,
    boss.hp/boss.maxHp
  );

  ctx.fillStyle="rgba(5,13,18,.72)";
  ctx.beginPath();
  ctx.arc(GAME.width/2,36,25,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.7)";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle="#ffb454";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.fillText("VS",GAME.width/2,42);
  ctx.font="bold 12px Arial";
  ctx.fillStyle="#eafcff";
  ctx.fillText(`SCORE ${score}`,GAME.width/2,82);
  if(player.flying || boss.flying){
    ctx.fillStyle=player.flying ? "#ffb457" : "#c596ff";
    ctx.font="bold 11px Arial";
    ctx.fillText("AIR COMBAT",GAME.width/2,115);
  }
  ctx.textAlign="left";

  ctx.fillStyle="rgba(229,247,242,.72)";
  ctx.font="bold 12px Arial";
  ctx.textAlign="right";
  ctx.fillText("MADE BY RITAM",GAME.width-24,GAME.height-24);
  ctx.textAlign="left";

  ctx.fillStyle=player.beamCooldown===0 ? "#fff0a8" : "rgba(255,240,168,.58)";
  ctx.font="bold 12px Arial";
  ctx.fillText(
    player.beamCooldown===0
      ? "H  BEAM READY"
      : `H  BEAM ${Math.ceil(player.beamCooldown/60)}s`,
    24,
    112
  );

  if(player.attackCooldown>0){
    ctx.fillStyle="rgba(0,0,0,.48)";
    ctx.beginPath();
    ctx.roundRect(GAME.width/2-80,96,160,27,13);
    ctx.fill();
    ctx.fillStyle="#8feaff";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillText("RASENGAN CHARGING",GAME.width/2,115);
    ctx.textAlign="left";
  }
}

/* -------------------------
   Overlay
------------------------- */

function drawOverlay(){
  if(state==="playing" || state==="countdown"){
    return;
  }

  ctx.fillStyle=
    "rgba(3,5,12,.80)";
  ctx.fillRect(
    0,0,
    GAME.width,
    GAME.height
  );

  const won=state==="won";
  const paused=state==="paused";

  ctx.textAlign="center";

  ctx.shadowBlur=26;
  ctx.shadowColor=paused ? "#ffd166" : won ? "#61ddff" : "#ff3d61";

  ctx.fillStyle=paused ? "#ffd166" : won ? "#8eeaff" : "#ff6375";

  ctx.font="900 64px Arial";

  ctx.fillText(
    paused ? "PAUSED" : won ? "YOU WIN!" : "GAME OVER",
    GAME.width/2,
    265
  );

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";
  ctx.font="22px Arial";

  ctx.fillText(
    paused ? "Tap the pause button to continue" : won ? "Pain has been defeated!" : "Naruto was defeated.",
    GAME.width/2,
    310
  );

  ctx.fillStyle="#cbd7e9";
  ctx.font="bold 18px Arial";

  ctx.fillText(
    paused ? "" : "Press R to restart",
    GAME.width/2,
    355
  );

  ctx.textAlign="left";
}

function drawCountdown(){
  const seconds=Math.ceil((countdownFrames-30)/60);
  const label=countdownFrames>30 ? seconds : "FIGHT!";

  ctx.save();
  ctx.fillStyle="rgba(3,5,12,.28)";
  ctx.fillRect(0,0,GAME.width,GAME.height);
  ctx.textAlign="center";
  ctx.font="900 86px Arial";
  ctx.fillStyle=label==="FIGHT!" ? "#ffb454" : "#fff";
  ctx.shadowBlur=28;
  ctx.shadowColor=label==="FIGHT!" ? "#ff542e" : "#61ddff";
  ctx.fillText(label,GAME.width/2,350);
  ctx.restore();
}

/* -------------------------
   Reset
------------------------- */

function showStartMenu(){
  state="menu";
  mobilePauseButton.textContent="Ⅱ";
  mobilePauseButton.setAttribute("aria-label","Pause game");
  playAgainButton.classList.remove("visible");
  updateDifficultyButtons();
  startMenu.classList.remove("hidden");
}

function startGame(selectedDifficulty){
  difficultyKey=DIFFICULTIES[selectedDifficulty] ? selectedDifficulty : "normal";
  difficulty=DIFFICULTIES[difficultyKey];
  updateDifficultyButtons();
  startMenu.classList.add("hidden");
  resetGame();
}

function resetGame(){
  score=0;
  state="countdown";
  displayedPlayerHp=difficulty.fighterHp;
  displayedBossHp=difficulty.fighterHp;
  mobilePauseButton.textContent="Ⅱ";
  mobilePauseButton.setAttribute("aria-label","Pause game");
  frame=0;
  shake=0;
  countdownFrames=210;
  lastAbilityUiFrame=-30;
  playAgainButton.classList.remove("visible");

  player.hp=player.maxHp;
  player.maxHp=difficulty.fighterHp;
  player.hp=player.maxHp;
  player.vx=0;
  player.vy=0;
  player.direction=1;
  player.animationTime=0;
  player.landSquash=0;
  player.attackCooldown=0;
  player.fireCooldown=0;
  player.invulnerable=0;
  player.nineTailsTimer=0;
  player.nineTailsCooldown=0;
  player.attackPose=0;
  player.kickCooldown=0;
  player.kickPose=0;
  player.thunderCooldown=0;
  player.beamCooldown=0;
  player.flying=false;
  player.jumpHeld=false;

  boss.x=900;
  boss.vx=1.45;
  boss.maxHp=difficulty.fighterHp;
  boss.hp=boss.maxHp;
  boss.speed=difficulty.bossSpeed;
  boss.hitFlash=0;
  boss.attackCooldown=0;
  boss.thunderCooldown=difficulty.painThunderDelay;
  boss.beamCooldown=180;
  boss.vy=0;
  boss.animationTime=0;
  boss.landSquash=0;
  boss.previousY=0;
  boss.grounded=true;
  boss.flying=false;
  boss.jumpCooldown=90;
  boss.flightTimer=0;
  boss.flightTargetY=0;
  boss.flightTargetX=0;
  boss.aiTimer=80;

  projectiles.length=0;
  fireballs.length=0;
  enemyProjectiles.length=0;
  tornadoKicks.length=0;
  thunderStrikes.length=0;
  particles.length=0;

  for(const orb of orbs){
    orb.collected=false;
  }

  /*
    THIS is the important spawn fix.
    Ground top = 590
    Naruto height = 92
    Therefore:
      y = 590 - 92 = 498

    So Naruto starts exactly ON the floor,
    not inside it and not below it.
  */
  respawnPlayer();

  /*
    Pain also starts exactly on the floor.
    590 - 96 = 494
  */
  boss.y=
    platforms[0].y-
    boss.height;
}

/* -------------------------
   Main loop
------------------------- */

function update(){
  frame++;

  playAgainButton.classList.toggle(
    "visible",
    state==="gameover" || state==="won"
  );

  if(painSoundCooldown>0){
    painSoundCooldown--;
  }

  if(state==="countdown"){
    countdownFrames--;

    if(countdownFrames<=0){
      state="playing";
    }

    updateParticles();
    return;
  }

  if(state==="playing"){
    updatePlayer();
    updateBoss();
    updateProjectiles();
    updateFireballs();
    updateBeamAttacks();
    updateTornadoKicks();
    updateThunderstorms();
    updateEnemyProjectiles();
    updateOrbs();
  }

  updateParticles();

  if(shake>0){
    shake*=.82;
  }
}

function draw(){
  ctx.save();

  if(shake>0){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  drawBackground();
  drawPlatforms();
  drawOrbs();
  drawProjectiles();
  drawFireballs();
  drawBeamAttacks();
  drawTornadoKicks();
  drawThunderstorms();
  drawEnemyProjectiles();
  drawBoss();
  drawPlayer();
  drawParticles();
  drawUI();
  drawOverlay();

  if(state==="countdown"){
    drawCountdown();
  }

  ctx.restore();
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

showStartMenu();
gameLoop();
</script>
</body>
</html>
